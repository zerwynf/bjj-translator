<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn the Brazilian Portuguese terminology of jiu jitsu.">
    <meta name="theme-color" content="#2E7D4F">
    <title>BJJ Translator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-bar">
        <h1>BJJ Translator</h1>
    </header>

    <main>
        <section class="word-of-the-day" aria-labelledby="wotd-label">
            <p class="section-label" id="wotd-label">Word of the Day</p>
            <a href="term.html" class="wotd-card" id="wotd-card">
                <div class="wotd-text">
                    <h2 id="wotd-title">Loading…</h2>
                    <p class="pronunciation" id="wotd-pronunciation"></p>
                </div>
                <span class="chevron" aria-hidden="true">›</span>
            </a>
        </section>

        <section class="search" role="search">
            <label for="search-input" class="visually-hidden">Search terms in English or Portuguese</label>
            <input type="search" id="search-input" placeholder="Search terms..." autocomplete="off" spellcheck="false">
            <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>×</button>
        </section>

        <section class="browse" aria-labelledby="browse-heading">
            <h2 id="browse-heading">Browse</h2>
            <div class="filter-chips" id="filter-chips" role="group" aria-label="Filter by category">
                <!-- Chips are built from CATEGORIES in data/terms.js -->
            </div>
            <p class="result-count" id="result-count" aria-live="polite"></p>
            <div class="term-list" id="term-list">
                <!-- Term cards are built from TERMS in data/terms.js -->
            </div>
        </section>
    </main>

    <script src="data/terms.js"></script>
    <script src="js/app.js"></script>
    <script>BJJ.initHome();</script>
</body>
</html>
