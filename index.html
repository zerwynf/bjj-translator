<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJJ Translator</title>
</head>
<body>
    <header>
        <h1>BJJ Translator</h1>
    </header>
    <main>
        <section class="word-of-the-day">
            <p class="section-label">Word of the Day</p>
            <a href="#" class="wotd-card">
                <h2>Guarda — Guard</h2>
                <p class="pronunciation">GWAR-dah</p>
            </a>
        </section>
        <section class="search">
            <input type="search" placeholder="Search terms...">
        </section>
        <section class="browse">
            <h2>Browse</h2>
            <div class="filter-chips">
                <button class="chip active">All</button>
                <button class="chip">Positions</button>
                <button class="chip">Submissions</button>
                <button class="chip">Sweeps</button>
                <button class="chip">Takedowns</button>
                <button class="chip">Anatomy</button>
                <button class="chip">Concepts &amp; Movements</button>
                <button class="chip">Commands &amp; Phrases</button>
                <button class="chip">Competition</button>
                <button class="chip">Belt System</button>
            </div>
            <div class="term-list">
                <a href="#" class="term-card">
                    <div class="term-info">
                        <span class="term-english">Americana</span>
                        <span class="term-portuguese">Chave Americana</span>
                    </div>
                    <span class="chevron">›</span>
                </a>
                <a href="#" class="term-card">
                    <div class="term-info">
                        <span class="term-english">Anaconda Choke</span>
                        <span class="term-portuguese">Estrangulamento Anaconda</span>
                    </div>
                    <span class="chevron">›</span>
                </a>
                <a href="#" class="term-card">
                    <div class="term-info">
                        <span class="term-english">Ankle Lock</span>
                        <span class="term-portuguese">Chave de Tornozelo</span>
                    </div>
                    <span class="chevron">›</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
